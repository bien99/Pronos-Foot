name: Test des sources

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests
      - name: Test
        env:
          FD_KEY: ${{ secrets.FD_KEY }}
        run: python test_sources.py
