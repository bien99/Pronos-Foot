name: Mise a jour quotidienne

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy scikit-learn requests
      - name: Calcul des pronostics
        env:
          FD_KEY: ${{ secrets.FD_KEY }}
        run: python pipeline.py
      - name: Enregistrer le site et l'historique
        run: |
          git config user.name "pronos-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "Mise a jour $(date -u +%F)"
          git push
